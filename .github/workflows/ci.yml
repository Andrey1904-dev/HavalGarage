name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Одновременные запуски одной ветки отменяются: экономим минуты CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линтер, типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Guard: секретные ключи не попадают в репозиторий'
        # В .env допустимы только публичные publishable-значения Supabase
        # (доступ к данным ограничен RLS, см. supabase/schema.sql).
        # Секретный (service_role) ключ в отслеживаемых файлах недопустим.
        run: |
          # Ищем именно тело ключа, а не упоминания слова в документации:
          # sb_secret_ + ≥16 символов тела или длинный legacy-JWT сервисного ключа.
          # Паттерны не матчат сами себя (после префикса идёт '[' класса).
          if git grep -nIE 'sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{60,}'; then
            echo "::error::Найден секретный ключ Supabase в отслеживаемых файлах. Используйте publishable-ключ."
            exit 1
          fi
          echo "Секретных ключей в отслеживаемых файлах нет (publishable-ключ Supabase — публичный по замыслу)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (node:test, логика калькуляторов, каталог, импорт, помощник)
        run: npm test

      - name: Smoke render (все маршруты без браузера)
        run: npm run smoke

      - name: Сверка каталога с текстом официальных прайс-листов (без сети)
        # Прогоняет разбор и сравнение по сохранённому тексту документов из
        # tests/fixtures/: цены приложения должны совпадать с официальными.
        run: node scripts/verify-parsed-documents.mjs

      - name: Sitemap generation (проверка, что карта сайта соответствует каталогу)
        run: |
          npm run seo
          if ! git diff --quiet -- public/sitemap.xml; then
            echo "::error::sitemap.xml устарел — выполните npm run seo и закоммитьте результат"
            git --no-pager diff -- public/sitemap.xml
            exit 1
          fi

      - name: Build (vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
          if-no-files-found: error

      - name: Check bundle size (защита от разрастания)
        run: |
          node -e "
            const { readdirSync, statSync } = require('fs');
            const files = readdirSync('dist/assets').filter(f => f.endsWith('.js'));
            let total = 0;
            for (const f of files) total += statSync('dist/assets/' + f).size;
            console.log('JS-бандлы:', files.length, '· суммарно', (total / 1024).toFixed(1), 'KiB');
            if (total > 3 * 1024 * 1024) { console.error('Превышен лимит 3 MiB'); process.exit(1); }
          "
